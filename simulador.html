<script>
// ======================================
// FERRAMENTA DE EXTENSÃO RURAL - MIP
// ======================================

let praga = 20;
let cultura = 100;
let resistencia = 0;
let inimigosNaturais = 60;

let custo = 0;
let historico = [];

const ETL = 30;

// ======================================
// UTIL
// ======================================
function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

// ======================================
// CLASSIFICAÇÃO AGRONÔMICA
// ======================================
function nivelRisco() {
    if (praga < 20) return "BAIXO";
    if (praga < 50) return "MODERADO";
    return "ALTO";
}

function estadoEcologico() {
    if (inimigosNaturais > 60) return "ESTÁVEL";
    if (inimigosNaturais > 30) return "DEGRADADO";
    return "CRÍTICO";
}

// ======================================
// DIAGNÓSTICO TÉCNICO
// ======================================
function gerarDiagnostico() {

    let risco = nivelRisco();
    let eco = estadoEcologico();

    let texto = "";

    if (risco === "BAIXO" && eco === "ESTÁVEL") {
        texto = "Sistema em equilíbrio. Recomenda-se apenas monitoramento preventivo.";
    }

    else if (risco === "MODERADO") {
        if (eco === "ESTÁVEL") {
            texto = "População em crescimento. Recomenda-se intensificar monitoramento e favorecer controle biológico.";
        } else {
            texto = "Desequilíbrio ecológico detectado. Evitar uso repetido de inseticidas.";
        }
    }

    else {
        if (resistencia > 60) {
            texto = "ALERTA: alta resistência química. Controle químico isolado tende a falhar.";
        } else {
            texto = "Infestação alta. Intervenção integrada necessária (biológico + monitoramento).";
        }
    }

    return texto;
}

// ======================================
// DINÂMICA NATURAL
// ======================================
function crescimentoNatural() {

    let taxa = 0.08 + (praga / 250);

    taxa -= (inimigosNaturais / 100) * 0.06;

    praga += praga * taxa;

    praga = clamp(praga, 0, 100);
}

// ======================================
// PAINEL INTELIGENTE
// ======================================
function atualizarPainel() {

    document.getElementById("status-saude").innerText = cultura.toFixed(0) + "%";
    document.getElementById("status-praga").innerText = praga.toFixed(0) + "%";
    document.getElementById("status-custo").innerText = "R$ " + custo;
    document.getElementById("status-resistencia").innerText = resistencia.toFixed(0) + "%";

    // interpretação agronômica visual
    let statusSaude = document.getElementById("status-saude");
    if (cultura > 70) statusSaude.innerText += " (SAUDÁVEL)";
    else if (cultura > 40) statusSaude.innerText += " (ATENÇÃO)";
    else statusSaude.innerText += " (CRÍTICO)";

    let statusPraga = document.getElementById("status-praga");
    statusPraga.innerText += " (" + nivelRisco() + ")";

    let statusEco = document.getElementById("status-resistencia");
    statusEco.innerText += " | ECO: " + estadoEcologico();

    // cores
    statusSaude.style.color =
        cultura < 40 ? "#c62828" : "#2E7D32";

    statusPraga.style.color =
        praga > 60 ? "#c62828" :
        praga < 20 ? "#2E7D32" : "#e65100";
}

// ======================================
// INTERVENÇÃO DO USUÁRIO
// ======================================
function jogarTurno(acao) {

    let box = document.getElementById("resultado-rodada");
    box.style.display = "block";

    crescimentoNatural();

    let log = "";

    if (acao === "quimico") {

        custo += 4500;

        resistencia += 8 + (praga / 40);
        resistencia = clamp(resistencia, 0, 100);

        let eficiencia = 50 * (1 - resistencia / 100);

        praga -= eficiencia;

        inimigosNaturais -= 10;
        inimigosNaturais = clamp(inimigosNaturais, 0, 100);

        log = "Aplicação química realizada. Efeito imediato, porém impacto negativo no equilíbrio ecológico.";

    }

    else if (acao === "biologico") {

        custo += 1800;

        let eficiencia = (inimigosNaturais / 100) * 40;

        praga -= eficiencia;

        inimigosNaturais += 5;
        inimigosNaturais = clamp(inimigosNaturais, 0, 100);

        resistencia -= 3;
        resistencia = clamp(resistencia, 0, 100);

        log = "Controle biológico aplicado. Eficiência dependente do sistema ecológico.";

    }

    else if (acao === "monitorar") {

        custo += 600;

        praga -= 2;

        inimigosNaturais += 3;
        inimigosNaturais = clamp(inimigosNaturais, 0, 100);

        log = "Monitoramento realizado. Sistema atualizado com dados de campo.";

    }

    praga = clamp(praga, 0, 100);

    // dano cultura
    if (praga > ETL) {
        cultura -= (praga - ETL) * 0.5;
    } else {
        cultura += 1.5;
    }

    cultura = clamp(cultura, 0, 100);

    // histórico técnico
    historico.push({
        turno: historico.length + 1,
        praga: praga.toFixed(1),
        cultura: cultura.toFixed(1),
        resistencia: resistencia.toFixed(1)
    });

    document.getElementById("texto-alerta").innerHTML =
        log + "<br><br><strong>Diagnóstico:</strong> " + gerarDiagnostico();

    atualizarPainel();
    verificarFim();
}

// ======================================
// FIM DE SISTEMA
// ======================================
function verificarFim() {

    if (cultura <= 0) {
        document.getElementById("texto-alerta").innerHTML =
            "Sistema colapsado. Pressão de pragas excedeu capacidade produtiva da cultura.";
        travar();
    }

    else if (praga < 5 && cultura > 70) {
        document.getElementById("texto-alerta").innerHTML =
            "Sistema estabilizado. Manejo integrado eficiente com equilíbrio agroecológico.";
        travar();
    }
}

function travar() {
    document.getElementById('btn-q').disabled = true;
    document.getElementById('btn-b').disabled = true;
    document.getElementById('btn-m').disabled = true;
    document.getElementById('btn-reset').style.display = "block";
}

// ======================================
// RESET
// ======================================
function reiniciarSimulador() {

    praga = 20;
    cultura = 100;
    resistencia = 0;
    inimigosNaturais = 60;
    custo = 0;
    historico = [];

    document.getElementById('btn-q').disabled = false;
    document.getElementById('btn-b').disabled = false;
    document.getElementById('btn-m').disabled = false;

    document.getElementById('btn-reset').style.display = "none";
    document.getElementById('resultado-rodada').style.display = "none";

    atualizarPainel();
}
</script>
