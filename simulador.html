<script>
// ===============================
// MIP EXTENSÃO RURAL - VERSÃO ESTÁVEL
// ===============================

let praga = 20;
let cultura = 100;
let resistencia = 0;
let inimigosNaturais = 60;

let custo = 0;

const ETL = 30;

// ===============================
// SAFE DOM (evita tela branca)
// ===============================
function el(id) {
    return document.getElementById(id);
}

// ===============================
function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

// ===============================
// INICIALIZAÇÃO SEGURA
// ===============================
window.addEventListener("load", () => {
    atualizarPainel();
});

// ===============================
// DINÂMICA NATURAL
// ===============================
function crescimentoNatural() {

    let taxa = 0.08 + (praga / 250);
    taxa -= (inimigosNaturais / 100) * 0.06;

    praga += praga * taxa;

    praga = clamp(praga, 0, 100);
}

// ===============================
// PAINEL
// ===============================
function atualizarPainel() {

    const s = el("status-saude");
    const p = el("status-praga");
    const c = el("status-custo");
    const r = el("status-resistencia");

    if (!s || !p || !c || !r) return;

    s.innerText = cultura.toFixed(0) + "%";
    p.innerText = praga.toFixed(0) + "%";
    c.innerText = "R$ " + custo;
    r.innerText = resistencia.toFixed(0) + "%";

    s.style.color = cultura < 40 ? "#c62828" : "#2E7D32";
    p.style.color = praga > 60 ? "#c62828" :
                    praga < 20 ? "#2E7D32" : "#e65100";
}

// ===============================
// JOGO
// ===============================
function jogarTurno(acao) {

    const box = el("resultado-rodada");
    if (box) box.style.display = "block";

    crescimentoNatural();

    let log = "";

    if (acao === "quimico") {

        custo += 4500;

        resistencia += 8 + (praga / 40);
        resistencia = clamp(resistencia, 0, 100);

        let eficiencia = 50 * (1 - resistencia / 100);
        praga -= eficiencia;

        inimigosNaturais -= 10;
        inimigosNaturais = clamp(inimigosNaturais, 0, 100);

        log = "Controle químico aplicado.";

    }

    else if (acao === "biologico") {

        custo += 1800;

        let eficiencia = (inimigosNaturais / 100) * 40;
        praga -= eficiencia;

        inimigosNaturais += 5;
        inimigosNaturais = clamp(inimigosNaturais, 0, 100);

        resistencia -= 3;
        resistencia = clamp(resistencia, 0, 100);

        log = "Controle biológico aplicado.";

    }

    else if (acao === "monitorar") {

        custo += 600;

        praga -= 2;

        inimigosNaturais += 3;
        inimigosNaturais = clamp(inimigosNaturais, 0, 100);

        log = "Monitoramento realizado.";
    }

    praga = clamp(praga, 0, 100);

    // dano cultura
    if (praga > ETL) {
        cultura -= (praga - ETL) * 0.5;
    } else {
        cultura += 1.5;
    }

    cultura = clamp(cultura, 0, 100);

    const txt = el("texto-alerta");
    if (txt) txt.innerHTML = log;

    atualizarPainel();
    verificarFim();
}

// ===============================
function verificarFim() {

    const txt = el("texto-alerta");

    if (cultura <= 0) {
        if (txt) txt.innerHTML = "Sistema colapsado.";
        travar();
    }

    else if (praga < 5 && cultura > 70) {
        if (txt) txt.innerHTML = "Sistema estabilizado com sucesso.";
        travar();
    }
}

// ===============================
function travar() {

    const q = el('btn-q');
    const b = el('btn-b');
    const m = el('btn-m');
    const r = el('btn-reset');

    if (q) q.disabled = true;
    if (b) b.disabled = true;
    if (m) m.disabled = true;
    if (r) r.style.display = "block";
}

// ===============================
function reiniciarSimulador() {

    praga = 20;
    cultura = 100;
    resistencia = 0;
    inimigosNaturais = 60;
    custo = 0;

    const r = el("resultado-rodada");
    if (r) r.style.display = "none";

    atualizarPainel();
}
</script>
