<script>
// ===============================
// MIP EXTENSÃO RURAL - VERSÃO FINAL ESTÁVEL
// ===============================

// FORÇA ESCOPOS GLOBAIS (IMPORTANTE)
window.saudeLavoura = 100;
window.infestacaoPraga = 20;
window.resistenciaQuimica = 0;
window.equilibrioBiologico = 60;
window.custoAcumulado = 0;

// ===============================
function atualizarPainel() {

    const s = document.getElementById("status-saude");
    const p = document.getElementById("status-praga");
    const c = document.getElementById("status-custo");
    const r = document.getElementById("status-resistencia");

    if (!s || !p || !c || !r) {
        console.error("Elementos do painel não encontrados");
        return;
    }

    s.innerText = saudeLavoura.toFixed(0) + "%";
    p.innerText = infestacaoPraga.toFixed(0) + "%";
    c.innerText = "R$ " + custoAcumulado;
    r.innerText = resistenciaQuimica.toFixed(0) + "%";

    s.style.color = saudeLavoura < 40 ? "red" : "green";
}

// ===============================
function crescimentoNatural() {
    let taxa = 0.08;

    taxa += infestacaoPraga / 200;
    taxa -= equilibrioBiologico / 200;

    infestacaoPraga += infestacaoPraga * taxa;

    if (infestacaoPraga > 100) infestacaoPraga = 100;
}

// ===============================
// 🔥 FUNÇÃO GLOBAL (ESSENCIAL)
// ===============================
window.jogarTurno = function(acao) {

    const box = document.getElementById("resultado-rodada");
    if (box) box.style.display = "block";

    crescimentoNatural();

    let log = "";

    if (acao === "quimico") {

        custoAcumulado += 4000;

        resistenciaQuimica += 10;
        if (resistenciaQuimica > 100) resistenciaQuimica = 100;

        let efeito = 50 * (1 - resistenciaQuimica / 100);

        infestacaoPraga -= efeito;

        equilibrioBiologico -= 10;

        log = "Uso de controle químico aplicado.";

    }

    else if (acao === "biologico") {

        custoAcumulado += 1500;

        let efeito = equilibrioBiologico * 0.4;

        infestacaoPraga -= efeito;

        equilibrioBiologico += 5;

        log = "Controle biológico aplicado.";

    }

    else if (acao === "monitorar") {

        custoAcumulado += 500;

        infestacaoPraga -= 2;

        equilibrioBiologico += 2;

        log = "Monitoramento realizado.";
    }

    infestacaoPraga = Math.max(0, Math.min(100, infestacaoPraga));

    // dano cultura simples
    if (!window.saudeLavoura) window.saudeLavoura = 100;

    if (infestacaoPraga > 30) {
        saudeLavoura -= (infestacaoPraga - 30) * 0.4;
    } else {
        saudeLavoura += 1.5;
    }

    saudeLavoura = Math.max(0, Math.min(100, saudeLavoura));

    const txt = document.getElementById("texto-alerta");
    if (txt) txt.innerHTML = log;

    atualizarPainel();
    verificarFim();
};

// ===============================
function verificarFim() {

    const txt = document.getElementById("texto-alerta");

    if (saudeLavoura <= 0) {
        if (txt) txt.innerHTML = "💀 Sistema colapsado.";
        travar();
    }

    else if (infestacaoPraga <= 5) {
        if (txt) txt.innerHTML = "🏆 Sistema estabilizado.";
        travar();
    }
}

// ===============================
function travar() {

    document.getElementById('btn-q').disabled = true;
    document.getElementById('btn-b').disabled = true;
    document.getElementById('btn-m').disabled = true;
    document.getElementById('btn-reset').style.display = "block";
}

// ===============================
function reiniciarSimulador() {

    saudeLavoura = 100;
    infestacaoPraga = 20;
    resistenciaQuimica = 0;
    equilibrioBiologico = 60;
    custoAcumulado = 0;

    document.getElementById('btn-q').disabled = false;
    document.getElementById('btn-b').disabled = false;
    document.getElementById('btn-m').disabled = false;

    document.getElementById('resultado-rodada').style.display = "none";

    atualizarPainel();
}

// inicialização
window.onload = atualizarPainel;

</script>
