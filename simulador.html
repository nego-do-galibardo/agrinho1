<script>
// =========================
// SIMULADOR MIP (VERSÃO CORRIGIDA REALISTA)
// =========================

let saudeLavoura = 100;
let infestacaoPraga = 20;

let resistenciaQuimica = 0;
let equilibrioBiologico = 60;

let custoAcumulado = 0;
let usosQuimico = 0;

const LIMIAR_DANO = 30;

// =========================
// UI
// =========================
function atualizarPainel() {
    document.getElementById('status-saude').innerText = saudeLavoura.toFixed(0) + "%";
    document.getElementById('status-praga').innerText = infestacaoPraga.toFixed(0) + "%";
    document.getElementById('status-custo').innerText = "R$ " + custoAcumulado;
    document.getElementById('status-resistencia').innerText = resistenciaQuimica.toFixed(0) + "%";

    document.getElementById('status-saude').style.color =
        saudeLavoura < 40 ? '#c62828' : '#2E7D32';

    document.getElementById('status-praga').style.color =
        infestacaoPraga > 60 ? '#c62828' :
        infestacaoPraga < 20 ? '#2E7D32' : '#e65100';
}

// =========================
// DINÂMICA NATURAL
// =========================
function crescimentoNatural() {
    // crescimento dependente da população (modelo mais realista)
    let taxaBase = 0.06 + (infestacaoPraga / 200);

    infestacaoPraga += infestacaoPraga * taxaBase;

    // controle natural (ecossistema)
    infestacaoPraga -= (equilibrioBiologico / 100) * 10;
}

// =========================
// TURNOS
// =========================
function jogarTurno(acao) {
    let logTexto = "";
    const boxResultado = document.getElementById('resultado-rodada');
    boxResultado.style.display = "block";

    // crescimento natural primeiro
    crescimentoNatural();

    if (acao === 'quimico') {

        usosQuimico++;
        custoAcumulado += 3800;

        // resistência = pressão de seleção
        resistenciaQuimica += 7 + (usosQuimico * 1.5);
        resistenciaQuimica = Math.min(resistenciaQuimica, 100);

        // eficiência cai com resistência
        let eficiencia = 50 * (1 - resistenciaQuimica / 100);

        infestacaoPraga -= eficiencia;

        // dano ao ecossistema
        equilibrioBiologico -= 8;
        equilibrioBiologico = Math.max(0, equilibrioBiologico);

        logTexto = "⚠️ Controle químico aplicado. Alta eficiência inicial, mas aumenta resistência e reduz equilíbrio ecológico.";

    }

    else if (acao === 'biologico') {

        usosQuimico = 0;
        custoAcumulado += 1400;

        // eficiência depende do ecossistema
        let eficiencia = (equilibrioBiologico / 100) * 35;

        infestacaoPraga -= eficiencia;

        // melhora ecossistema
        equilibrioBiologico += 6;
        equilibrioBiologico = Math.min(100, equilibrioBiologico);

        // reduz resistência lentamente
        resistenciaQuimica -= 4;
        resistenciaQuimica = Math.max(0, resistenciaQuimica);

        logTexto = "🌿 Controle biológico aplicado. Eficiência depende do equilíbrio ecológico.";

    }

    else if (acao === 'monitorar') {

        custoAcumulado += 500;

        // monitoramento não mata praga diretamente
        infestacaoPraga -= 3;

        // melhora decisões (simulação)
        equilibrioBiologico += 2;
        equilibrioBiologico = Math.min(100, equilibrioBiologico);

        logTexto = "🔍 Monitoramento realizado. Reduz risco de surtos e melhora manejo.";

    }

    // limites
    infestacaoPraga = Math.max(0, Math.min(100, infestacaoPraga));

    // dano baseado em limiar (MIP real)
    if (infestacaoPraga > LIMIAR_DANO) {
        saudeLavoura -= (infestacaoPraga - LIMIAR_DANO) * 0.5;
    } else {
        saudeLavoura += 2;
    }

    saudeLavoura = Math.max(0, Math.min(100, saudeLavoura));

    document.getElementById('texto-alerta').innerHTML = logTexto;

    atualizarPainel();
    verificarFimJogo();
}

// =========================
// FIM DE JOGO
// =========================
function verificarFimJogo() {

    if (saudeLavoura <= 0) {
        document.getElementById('texto-alerta').innerHTML =
            "💀 Safra perdida. Pressão de pragas ultrapassou o limiar econômico.";
        travarBotoes();
    }

    else if (infestacaoPraga <= 5) {
        document.getElementById('texto-alerta').innerHTML =
            "🏆 MIP aplicado corretamente. Sistema equilibrado e sustentável.";
        travarBotoes();
    }
}

function travarBotoes() {
    document.getElementById('btn-q').disabled = true;
    document.getElementById('btn-b').disabled = true;
    document.getElementById('btn-m').disabled = true;
    document.getElementById('btn-reset').style.display = "block";
}

// =========================
// RESET
// =========================
function reiniciarSimulador() {

    saudeLavoura = 100;
    infestacaoPraga = 20;
    resistenciaQuimica = 0;
    equilibrioBiologico = 60;
    custoAcumulado = 0;
    usosQuimico = 0;

    document.getElementById('btn-q').disabled = false;
    document.getElementById('btn-b').disabled = false;
    document.getElementById('btn-m').disabled = false;
    document.getElementById('btn-reset').style.display = "none";
    document.getElementById('resultado-rodada').style.display = "none";

    atualizarPainel();
}
</script>
